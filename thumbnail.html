<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    background: #06060b;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Background glows */
  .glow-1 {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    top: -200px;
    right: -100px;
    border-radius: 50%;
  }
  .glow-2 {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
    bottom: -150px;
    left: -100px;
    border-radius: 50%;
  }
  .glow-3 {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(220, 38, 38, 0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }

  /* Grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    text-align: center;
  }

  .logo-container {
    margin-bottom: 40px;
  }

  .logo-container img {
    width: 140px;
    height: 140px;
    filter: drop-shadow(0 0 40px rgba(99, 102, 241, 0.4));
  }

  h1 {
    font-size: 120px;
    font-weight: 900;
    color: white;
    letter-spacing: -4px;
    line-height: 1;
    margin-bottom: 12px;
  }

  h1 span {
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 32px;
    font-weight: 400;
    color: rgba(226, 232, 240, 0.6);
    letter-spacing: 2px;
    margin-bottom: 60px;
  }

  .pillars {
    display: flex;
    gap: 40px;
  }

  .pillar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    background: rgba(12, 12, 20, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
  }

  .pillar-icon {
    font-size: 28px;
  }

  .pillar-text {
    font-size: 18px;
    font-weight: 600;
    color: rgba(226, 232, 240, 0.8);
  }

  .chain-badge {
    position: absolute;
    bottom: 40px;
    right: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: rgba(12, 12, 20, 0.8);
    border: 1px solid rgba(30, 30, 46, 0.5);
    border-radius: 8px;
    font-size: 14px;
    color: rgba(226, 232, 240, 0.4);
  }

  .chain-badge .dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
  }

  .hackathon-badge {
    position: absolute;
    top: 40px;
    left: 60px;
    padding: 10px 20px;
    background: rgba(12, 12, 20, 0.8);
    border: 1px solid rgba(30, 30, 46, 0.5);
    border-radius: 8px;
    font-size: 14px;
    color: rgba(226, 232, 240, 0.4);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>
  <div class="grid"></div>

  <div class="hackathon-badge">THE SYNTHESIS 2026</div>

  <div class="content">
    <div class="logo-container">
      <img src="geass_square.png" alt="GEASS">
    </div>
    <h1>G<span>EASS</span></h1>
    <div class="subtitle">THE POWER OF ABSOLUTE DELEGATION</div>
    <div class="pillars">
      <div class="pillar">
        <span class="pillar-icon">⚡</span>
        <span class="pillar-text">Scoped Spending</span>
      </div>
      <div class="pillar">
        <span class="pillar-icon">🧠</span>
        <span class="pillar-text">Private Reasoning</span>
      </div>
      <div class="pillar">
        <span class="pillar-icon">🔐</span>
        <span class="pillar-text">Identity Separation</span>
      </div>
    </div>
  </div>

  <div class="chain-badge">
    <span class="dot"></span>
    Base Sepolia · MetaMask Delegation Framework · Venice.ai · SIWA
  </div>
</body>
</html>
